[package]
name = "harnessy"
# Internal crate version: the distributed product version comes from package.json.
version = "0.0.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "harnessy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
