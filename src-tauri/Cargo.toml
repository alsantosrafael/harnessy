[package]
name = "harnessy"
# Back-end version, versioned independently of the front-end in package.json.
version = "0.27.3"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "harnessy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
serde_json = "1"
toml = "1.0.7"
sha2 = "0.10"
tauri-plugin-notification = "2"
